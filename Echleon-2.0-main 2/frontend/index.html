<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSense Core Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --amber-glow: rgba(251, 191, 36, 0.6);
        --core-glow-opacity: 0.15;
      }

      body {
  background-color: #020202;
  color: #e2e8f0;
  font-family: 'Oxanium', sans-serif;
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}


      /* Recreating the Scene from the Image */
      .scene-container {
        position: fixed;
        inset: 0;
        z-index: -2;
        perspective: 1000px;
        background: #000;
        overflow: hidden;
      }

      /* Yellow Energy Background Image */
.scene-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("/yellow-core.jpg"); /* put image in public folder */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.18;        /* KEY PART */
  z-index: -1;
}


      /* Grid Floor */
      .floor {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 200%;
        height: 60%;
        background-image: 
          linear-gradient(to right, rgba(251, 191, 36, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(251, 191, 36, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        transform: translateX(-50%) rotateX(60deg);
        transform-origin: bottom center;
        mask-image: linear-gradient(to bottom, transparent, black);
      }

      /* Central Crystal Recreated with CSS */
      .central-crystal {
        position: absolute;
        bottom: 35%;
        left: 50%;
        width: 120px;
        height: 240px;
        transform: translateX(-50%);
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.6));
        clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
        box-shadow: 0 0 100px rgba(251, 191, 36, 0.4);
        filter: blur(2px);
        transition: all 0.3s ease;
      }

      /* Light Beam */
      .vertical-beam {
        position: absolute;
        bottom: 35%;
        left: 50%;
        width: 4px;
        height: 100vh;
        background: linear-gradient(to top, var(--amber-glow), transparent);
        box-shadow: 0 0 40px 4px var(--amber-glow);
        transform: translateX(-50%);
        opacity: 0.6;
      }

      /* Pillars from the image */
      .pillar {
        position: absolute;
        bottom: 30%;
        width: 80px;
        height: 300px;
        border: 2px solid rgba(251, 191, 36, 0.1);
        border-radius: 40px;
        background: linear-gradient(to bottom, rgba(251, 191, 36, 0.05), transparent);
      }
      .pillar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--amber-glow);
        box-shadow: 0 0 20px var(--amber-glow);
        border-radius: 50%;
      }
      .pillar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--amber-glow);
        box-shadow: 0 0 15px var(--amber-glow);
        border-radius: 50%;
      }
      .p-left-1 { left: 15%; height: 250px; }
      .p-left-2 { left: 25%; height: 320px; bottom: 35%; }
      .p-right-1 { right: 15%; height: 250px; }
      .p-right-2 { right: 25%; height: 320px; bottom: 35%; }

      /* Global Classes */
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .glass-panel {
  background: linear-gradient(
    180deg,
    rgba(10, 10, 10, 0.88),
    rgba(5, 5, 5, 0.92)
  );
  border: 1px solid rgba(251, 191, 36, 0.25);
  box-shadow:
    0 0 0 1px rgba(251, 191, 36, 0.05),
    0 20px 40px rgba(0, 0, 0, 0.85),
    inset 0 0 40px rgba(251, 191, 36, 0.04);
  transition: all 0.3s ease;
}
    .glass-panel:hover {
  border-color: rgba(251, 191, 36, 0.5);
  box-shadow:
    0 0 30px rgba(251, 191, 36, 0.25),
    0 25px 60px rgba(0, 0, 0, 0.9),
    inset 0 0 60px rgba(251, 191, 36, 0.08);
  transform: translateY(-2px);
}


      .glow-amber { box-shadow: 0 0 30px -5px rgba(251, 191, 36, 0.5); }
      .text-glow-amber { text-shadow: 0 0 15px rgba(251, 191, 36, 0.8); }

      /* Interaction States */
      body.core-active .central-crystal {
        transform: translateX(-50%) scale(1.1);
        filter: blur(1px) brightness(1.5);
        box-shadow: 0 0 150px rgba(251, 191, 36, 0.8);
      }
      body.core-active .vertical-beam {
        width: 8px;
        opacity: 1;
      }
      body.core-active .glass-panel {
  border-color: rgba(251, 191, 36, 0.6);
  box-shadow:
    0 0 40px rgba(251, 191, 36, 0.35),
    inset 0 0 80px rgba(251, 191, 36, 0.12);
}


      /* Energy Highlight Text */
.energy-text {
  color: #fbbf24;
  text-shadow: 0 0 18px rgba(251, 191, 36, 0.8);
}

    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Persistent Background Scene -->
    <div class="scene-container">
      <div class="floor"></div>
      <div class="pillar p-left-1"></div>
      <div class="pillar p-left-2"></div>
      <div class="pillar p-right-1"></div>
      <div class="pillar p-right-2"></div>
      <div class="central-crystal"></div>
      <div class="vertical-beam"></div>
    </div>                  
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
